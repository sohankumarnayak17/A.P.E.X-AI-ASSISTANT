<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.P.E.X</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  </head>

  <body>
    <div class="scanlines"></div>

    <div class="container">

      <!-- Top HUD -->
      <div class="hud-top">
        <span class="hud-label">A.P.E.X // ONLINE</span>
        <span class="hud-time" id="clock"></span>
        <span class="hud-label">SYS: NOMINAL</span>
      </div>

      <div class="main">

        <!-- Particle Sphere Orb -->
        <div class="orb-wrapper">
          <canvas id="particleCanvas" width="280" height="280"></canvas>
          <p class="orb-status" id="status">STANDBY</p>
          <div class="orb-stats">
            <div class="stat">PWR <b id="stat-pwr">100%</b></div>
            <div class="stat">NET <b id="stat-net">SECURE</b></div>
            <div class="stat">SYS <b id="stat-sys">NOMINAL</b></div>
          </div>
        </div>

        <!-- APEX Response -->
        <div class="response-box" id="responseBox">
          <p id="responseText">Awaiting your command, Boss.</p>
        </div>

        <!-- Transcript -->
        <div class="transcript-box" id="transcriptBox">
          <span class="label">YOU ›</span>
          <span id="transcriptText">...</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="btn-talk" id="talkBtn">&#9679; HOLD TO SPEAK</button>
          <button class="btn-mute" id="muteBtn">MUTE</button>
        </div>

      </div>

      <!-- Chat Input -->
      <div class="col-md-12">
        <div class="text-center">
          <div id="textinput" class="d-flex align-items-center gap-1 justify-content-center">
            <input type="text" name="chatbox" id="chatbox" placeholder="type here" oninput="showhidebutton(this.value)" />
            <button id="micbtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
            <button id="chat" class="glow-on-hover" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling"><i class="bi bi-chat"></i></button>
            <button id="sendbtn" class="glow-on-hover" hidden><i class="bi bi-send"></i></button>
            <button id="setting" class="glow-on-hover"><i class="bi bi-gear"></i></button>
          </div>
        </div>
      </div>

      <!-- Bottom HUD -->
      <div class="hud-bottom">
        <span class="hud-label" id="listenStatus">MIC: OFF</span>
        <span class="hud-label">APEX v1.0</span>
        <span class="hud-label" id="apiStatus">API: CONNECTED</span>
      </div>

      <!-- Chat History Offcanvas -->
      <div class="offcanvas offcanvas-start apex-offcanvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title"><i class="bi bi-clock-history me-2"></i>Chat History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
          <p class="no-history-msg">No history yet. Start talking to A.P.E.X.</p>
          <div id="historyList"></div>
        </div>
      </div>

    </div>

    <script src="/eel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="renderer.js"></script>

  </body>
</html>
