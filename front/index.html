<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.P.E.X</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <!-- ✅ FIX 1: Bootstrap CSS added — required for offcanvas, d-flex, col-md-12 etc. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body>
    <div class="container">

      <!-- SiriWave (hidden by default, shown on mic click) -->
      <div id="siri-container" hidden></div>
      <div class="scanlines"></div>

      <!-- Top HUD Bar -->
      <div class="hud-top">
        <span class="hud-label">A.P.E.X // ONLINE</span>
        <span class="hud-time" id="clock"></span>
        <span class="hud-label">SYS: NOMINAL</span>
      </div>

      <!-- Main Container -->
      <div class="main">

        <!-- Hologram Orb (visible by default, hidden on mic click) -->
        <div class="orb-wrapper" id="orb-wrapper">
          <div class="holo-orb">
            <div class="ring ring-1">
              <div class="ring ring-2">
                <div class="ring ring-3"></div>
              </div>
            </div>
            <div class="ring ring-4"></div>
            <div class="orb-scan"></div>
            <div class="orbit-dot dot-1"></div>
            <div class="orbit-dot dot-2"></div>
            <div class="orbit-dot dot-3"></div>
            <div class="orb-core">
              <div class="core-inner"></div>
            </div>
          </div>
          <p class="orb-status" id="status">STANDBY</p>
        </div>

        <!-- Chat / Response Display -->
        <div class="response-box" id="responseBox">
          <p id="responseText">Awaiting your command, Boss.</p>
        </div>

        <!-- Transcript -->
        <div class="transcript-box" id="transcriptBox">
          <span class="label">YOU &rsaquo;</span>
          <span id="transcriptText">...</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="btn-talk" id="talkBtn">&#9679; HOLD TO SPEAK</button>
          <button class="btn-mute" id="muteBtn">MUTE</button>
        </div>

      </div>

      <!-- ============================================================
           Chat Input Section
           ✅ FIX 2: Proper Bootstrap col wrapper retained
           ============================================================ -->
      <div class="col-md-12">
        <div class="text-center">
          <div id="textinput" class="d-flex align-items-center gap-1">

            <!-- ✅ FIX 3: oninput wired to showhidebutton() so mic/send toggle works
                 ✅ FIX 4: data-bs-toggle="offcanvas" added
                 ✅ FIX 5: data-bs-target typo fixed "offcanvasScorolling" → "offcanvasScrolling"
                 ✅ FIX 6: aria-controls fixed (had a space: "aria -controls") -->
            <input
              type="text"
              name="chatbox"
              id="chatbox"
              placeholder="type here"
              oninput="showhidebutton(this.value)"
              data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasScrolling"
              aria-controls="offcanvasScrolling"
            />

            <!-- ✅ FIX 7: id was "mic" — changed to "micbtn" to match showhidebutton() JS logic -->
            <button id="micbtn" class="glow-on-hover">
              <i class="bi bi-mic"></i>
            </button>

            <button id="chat" class="glow-on-hover">
              <i class="bi bi-chat"></i>
            </button>

            <!-- ✅ FIX 8: sendbtn starts hidden — only appears when user types (showhidebutton) -->
            <button id="sendbtn" class="glow-on-hover" hidden>
              <i class="bi bi-send"></i>
            </button>

            <button id="setting" class="glow-on-hover">
              <i class="bi bi-gear"></i>
            </button>

          </div>
        </div>
      </div>

      <!-- Bottom HUD Bar -->
      <div class="hud-bottom">
        <span class="hud-label" id="listenStatus">MIC: OFF</span>
        <span class="hud-label">APEX v1.0</span>
        <span class="hud-label" id="apiStatus">API: CONNECTED</span>
      </div>

      <!-- ============================================================
           Offcanvas Sidebar
           ✅ FIX 9:  Placed OUTSIDE .main so it doesn't break layout
           ✅ FIX 10: id="offcanvasScrolling" matches data-bs-target exactly
           ✅ FIX 11: Removed stray "show" class (was forcing sidebar open on load)
           ✅ FIX 12: data-bs-scroll="true" — page stays scrollable while sidebar is open
           ✅ FIX 13: data-bs-backdrop="false" — HUD and UI remain visible behind sidebar
           ✅ FIX 14: aria-labelledby matches offcanvas title id correctly
           ============================================================ -->
      <div
        class="offcanvas offcanvas-start text-bg-dark"
        data-bs-scroll="true"
        data-bs-backdrop="false"
        tabindex="-1"
        id="offcanvasScrolling"
        aria-labelledby="offcanvasScrollingLabel"
      >
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasScrollingLabel">
            <i class="bi bi-clock-history me-2"></i>Chat History
          </h5>
          <!-- ✅ FIX 15: data-bs-dismiss="offcanvas" (was "offcanvasDark" — wrong value) -->
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div class="offcanvas-body">
          <p class="text-secondary">No history yet. Start talking to A.P.E.X.</p>
        </div>
      </div>

    </div><!-- /.container -->

    <script src="/eel.js"></script>

    <!-- ✅ FIX 16: jQuery upgraded 2.1.3 → 3.7.1 (security fixes + jQuery UI 1.13 compatibility) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- ✅ FIX 17: jQuery UI upgraded 1.11.2 → 1.13.2 (compatible with jQuery 3.x) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>

    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

    <!-- ✅ FIX 18: Bootstrap JS bundle added — REQUIRED for data-bs-toggle="offcanvas" to work -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="main.js"></script>
    <script src="renderer.js"></script>

  </body>
</html>
